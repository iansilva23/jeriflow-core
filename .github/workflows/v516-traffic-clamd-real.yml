name: V5.16 — ClamAV real com assinatura sintética e PostgreSQL
on:
  push:
    branches: [feature/v516-transito-clamd-real-ci-20261010]
    paths:
      - tests/integration/traffic-photo-clamd-real-v516.test.mjs
      - docs/PARIDADE_V516_TRANSITO_CLAMD_REAL_FASE11.md
      - .github/workflows/v516-traffic-clamd-real.yml
      - apps/api/src/traffic-photo-malware-v516.ts
      - apps/api/src/traffic-photo-verified-worker-v516.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-clamd:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_WORKER_DSN: postgresql://jeriflow_scan_test:ephemeral-scan-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências por lockfile
        run: npm run setup
      - name: Instalar pacote do ClamAV REAL (sem freshclam nem servidores privados)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clamav-daemon
          test -x /usr/sbin/clamd
          /usr/sbin/clamd --version
      - name: TypeScript
        run: npm run typecheck
      - name: Daemon clamd real, assinatura local controlada, worker e PostgreSQL
        run: node --test tests/integration/traffic-photo-clamd-real-v516.test.mjs
      - name: Regressão do scanner (daemon sintético, casos de falha)
        run: node --test tests/traffic-photo-malware-v516.test.mjs
      - name: Contrato imutável Cidadão Guarda SEMUS
        run: node --test tests/citizen-traffic-v516.test.mjs
  worker-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_WORKER_DSN: postgresql://jeriflow_scan_test:ephemeral-scan-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout isolado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: Regressão PostgreSQL worker em banco SEPARADO
        run: node --test tests/integration/traffic-photo-worker-v516.test.mjs
