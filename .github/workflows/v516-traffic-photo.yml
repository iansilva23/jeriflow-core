name: V5.16 — fotografia obrigatória (validação técnica)
on:
  push:
    branches: [feature/v516-transito-foto-validacao-20261010]
    paths:
      - apps/api/src/traffic-photo-candidate.ts
      - tests/traffic-photo-candidate-v516.test.mjs
      - packages/contracts/src/citizen-traffic-v516.ts
      - tests/citizen-traffic-v516.test.mjs
      - .github/workflows/v516-traffic-photo.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v516-photo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  photo-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Buscar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências pelo lockfile
        run: npm run setup
      - name: Regressão do protocolo canônico V5.16
        run: node --test tests/citizen-traffic-v516.test.mjs
      - name: Validação de foto recebida da câmera ou galeria
        run: node --test tests/traffic-photo-candidate-v516.test.mjs
      - name: Tipos TypeScript
        run: npm run typecheck
