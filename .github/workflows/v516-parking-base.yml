name: V5.16 — regras originais de estacionamento
on:
  push:
    branches: [feature/v516-estacionamento-base-pg-20261011]
    paths:
      - apps/api/src/parking-stay-policy-v516.ts
      - tests/parking-stay-policy-v516.test.mjs
      - docs/PARIDADE_V516_ESTACIONAMENTO_REGRAS_FASE21.md
      - .github/workflows/v516-parking-base.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parking-original-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: TypeScript
        run: npm run typecheck
      - name: Regras de estacionamento da V5.16
        run: node --test tests/parking-stay-policy-v516.test.mjs
      - name: Regressões Cidadão e identidade
        run: node --test tests/citizen-traffic-v516.test.mjs tests/traffic-citizen-identity-v516.test.mjs
