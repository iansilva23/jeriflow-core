name: V5.16 Guarda - formulario RN de apoio na previa
on:
  push:
    branches: [feature/v516-guarda-apoio-rn-preview-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-support-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: Contrato de UI, transporte e idempotencia
        run: node --test tests/guard-support-rn-preview-v516.test.mjs
      - name: Tipagem e regressao completa
        run: npm run typecheck && npm --workspace apps/guarda run typecheck && npm test
