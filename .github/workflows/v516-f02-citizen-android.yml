name: V5.16 Cidadao - Android e entrega à Guarda
on:
  pull_request:
    branches: [continuity/f02-citizen-link-app-20261113, continuity/f02-citizen-traffic-app-20261113, continuity/f02-citizen-guard-proof-20261113, continuity/f02-citizen-form-v516-20261113]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 37
    env:
      JF_NATIVE_CIDADAO_TRAFFIC_SMOKE: ${{ github.head_ref == 'continuity/f02-citizen-traffic-e2e-20261114' && '1' || '0' }}
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_CIDADAO_V516_PREVIEW: "1"
      EXPO_PUBLIC_LOCAL_API: "1"
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - run: npm --workspace apps/cidadao run typecheck
      - run: node --test tests/auth-clients.test.mjs tests/native-auth-screen.test.mjs tests/guard-auth-slot-v516.test.mjs
      - run: node scripts/native-runner.mjs android cidadao build
      - name: Transferir APK verificado para o emulador
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cidadao-android-apk-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/native/android/cidadao/verified.apk
            artifacts/native/android/cidadao/report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cidadao-android-build-${{ github.sha }}
          path: artifacts/native/android/cidadao/report.json
          if-no-files-found: ignore
          retention-days: 3
  android-smoke:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      JF_NATIVE_CIDADAO_TRAFFIC_SMOKE: ${{ github.head_ref == 'continuity/f02-citizen-traffic-e2e-20261114' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cidadao-android-apk-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/native-build/cidadao
          digest-mismatch: error
      - name: Preparar ambiente sintético do teste autenticado
        if: env.JF_NATIVE_CIDADAO_TRAFFIC_SMOKE == '1'
        run: |
          npm run setup
          npm run infra:up
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clamav-daemon
          umask 077
          node scripts/native-citizen-e2e-server.mjs > "$RUNNER_TEMP/jf-citizen-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/jf-citizen-server.pid"
          for attempt in $(seq 1 90); do
            if test -f "$RUNNER_TEMP/jeriflow-citizen-fixture.json" && curl -fsS http://127.0.0.1:3001/health/live >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/jf-citizen-server.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/jf-citizen-server.log"
              exit 1
            fi
            sleep 2
          done
          exit 1
      - name: Instalar APK, abrir autenticação e verificar envio quando habilitado
        id: smoke
        run: node scripts/native-runner.mjs android cidadao smoke
      - name: Confirmar o protocolo emitido no PostgreSQL
        if: env.JF_NATIVE_CIDADAO_TRAFFIC_SMOKE == '1'
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { ownerClient } from "./scripts/identity-database.mjs";
          const fixture = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, "jeriflow-citizen-fixture.json")));
          const report = JSON.parse(readFileSync("artifacts/native/android/cidadao/report.json"));
          const protocolId = report.apps[0].authenticatedTraffic.protocolId;
          const owner = ownerClient(process.cwd());
          try {
            await owner.connect();
            const { rows } = await owner.query(
              "SELECT id, status, has_photo FROM app.citizen_v516_traffic_protocols WHERE municipality_id=$1",
              [fixture.municipalityId]);
            assert.deepEqual(rows, [{ id: protocolId, status: "RECEBIDA", has_photo: true }]);
          } finally { await owner.end(); }
          JS
      - name: Evidências do emulador
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cidadao-android-smoke-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/native/android/cidadao/report.json
            artifacts/native/android/cidadao/*.png
            artifacts/native/android/cidadao/*.ui.json
          if-no-files-found: error
          retention-days: 3
      - name: Encerrar servidor local do teste
        if: always() && env.JF_NATIVE_CIDADAO_TRAFFIC_SMOKE == '1'
        run: |
          if test -f "$RUNNER_TEMP/jf-citizen-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/jf-citizen-server.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/jeriflow-citizen-fixture.json"
  postgres-clamd-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_WORKER_DSN: postgresql://jeriflow_scan_test:ephemeral-scan-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: Instalar clamd verdadeiro apenas com base local inofensiva
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clamav-daemon
          test -x /usr/sbin/clamd
      - name: TypeScript
        run: npm run typecheck
      - name: PostgreSQL 17 + ClamAV REAL + protocolo único V5.16
        run: node --test tests/integration/traffic-photo-private-pipeline-real-v516.test.mjs
