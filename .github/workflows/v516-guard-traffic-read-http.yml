name: V5.16 — HTTP opt-in da fila Guarda SEMUS e PostgreSQL real
on:
  push:
    branches: [feature/v516-guarda-http-leitura-20261011]
    paths:
      - apps/api/src/guard-traffic-read-http-v516.ts
      - apps/api/src/server.ts
      - tests/guard-traffic-read-http-v516.test.mjs
      - tests/integration/traffic-guard-queue-v516.test.mjs
      - docs/PARIDADE_V516_GUARDA_HTTP_FASE34.md
      - .github/workflows/v516-guard-traffic-read-http.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-http-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - run: npm run typecheck
      - name: Contrato HTTP Guarda read-only e regressões do servidor
        run: node --test tests/guard-traffic-read-http-v516.test.mjs tests/identity-http.test.mjs tests/traffic-photo-http-v516.test.mjs
  read-http-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - run: npm run typecheck
      - name: HTTP com PostgreSQL 17, sessão, município, PII e status originais
        run: node --test tests/integration/traffic-guard-queue-v516.test.mjs
      - name: Regressão protocolo Cidadão e identidade
        run: node --test tests/citizen-traffic-v516.test.mjs tests/traffic-citizen-identity-v516.test.mjs
