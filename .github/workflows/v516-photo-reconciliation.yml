name: V5.16 — reconciliação segura e somente leitura de fotos
on:
  push:
    branches: [feature/v516-reconciliacao-segura-fotos-20261010]
    paths:
      - apps/api/src/traffic-photo-reconciliation-v516.ts
      - infra/migrations/010-citizen-v516-photo-reconciliation-preview.sql
      - tests/integration/traffic-photo-reconciliation-v516.test.mjs
      - docs/PARIDADE_V516_RECONCILIACAO_FASE20.md
      - .github/workflows/v516-photo-reconciliation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_RECONCILER_DSN: postgresql://jeriflow_reconcile_test:ephemeral-reconcile-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências fixadas
        run: npm run setup
      - name: TypeScript
        run: npm run typecheck
      - name: Foto privada com PostgreSQL e arquivos WebP reais
        run: node --test tests/integration/traffic-photo-reconciliation-v516.test.mjs
      - name: Regressão do formulário V5.16
        run: node --test tests/citizen-traffic-v516.test.mjs tests/traffic-citizen-identity-v516.test.mjs
