name: V5.16 Guarda - apoio HTTP opt-in
on:
  push:
    branches: [feature/v516-guarda-apoio-http-injecao-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: Contrato HTTP e isolamento do pedido de apoio
        run: node --test tests/guard-support-http-injected-v516.test.mjs
      - name: Tipagem e regressao completa
        run: npm run typecheck && npm --workspace apps/guarda run typecheck && npm test
