name: V5.16 — foto limpa privada por município
on:
  push:
    branches: [feature/v516-transito-foto-limpa-armazenamento-20261010]
    paths:
      - apps/api/src/traffic-photo-clean-store-v516.ts
      - apps/api/src/traffic-photo-normalize-v516.ts
      - tests/traffic-photo-clean-store-v516.test.mjs
      - tests/traffic-photo-normalize-v516.test.mjs
      - .github/workflows/v516-traffic-clean-store.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v516-traffic-clean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Instalar dependências pelo lockfile
        run: npm run setup
      - name: Contrato original Cidadão Guarda SEMUS
        run: node --test tests/citizen-traffic-v516.test.mjs
      - name: Foto e formato original V5.16
        run: node --test tests/traffic-photo-candidate-v516.test.mjs
      - name: Quarentena dos arquivos de origem
        run: node --test tests/traffic-photo-quarantine-v516.test.mjs
      - name: Normalização 1200px e limpeza EXIF
        run: node --test tests/traffic-photo-normalize-v516.test.mjs
      - name: Mídia limpa persistente com isolamento municipal
        run: node --test tests/traffic-photo-clean-store-v516.test.mjs
      - name: Verificação TypeScript
        run: npm run typecheck
