name: V5.16 Guarda - plantao HTTP por injecao
on:
  push:
    branches: [feature/v516-guarda-shift-server-injecao-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: Tipagem e testes HTTP com servidor loopback
        run: npm run typecheck && node --test tests/guard-shift-server-injected-v516.test.mjs
      - name: Regressao do projeto e do app Guarda
        run: npm --workspace apps/guarda run typecheck && npm test
