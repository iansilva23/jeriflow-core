name: V5.16 — cadastro Cidadão com PostgreSQL real
on:
  push:
    branches: [feature/v516-cidadao-login-pg-20261010]
    paths:
      - infra/migrations/004-citizen-v516.sql
      - apps/api/src/citizen-accounts-v516.ts
      - tests/integration/citizen-v516.test.mjs
      - docs/PARIDADE_V516_CIDADAO_CADASTRO_PG_FASE8.md
      - .github/workflows/v516-citizen-registration-pg.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v516-citizen-pg-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Instalar dependências pelo lockfile
        run: npm run setup
      - name: TypeScript sem emissão
        run: npm run typecheck
      - name: Cadastro Cidadão, moderação e privilégios PostgreSQL reais
        run: node --test tests/integration/citizen-v516.test.mjs
      - name: Identidade do visitante e do cadastrado
        run: node --test tests/traffic-citizen-identity-v516.test.mjs
      - name: Regressão contrato Cidadão Guarda SEMUS
        run: node --test tests/citizen-traffic-v516.test.mjs
