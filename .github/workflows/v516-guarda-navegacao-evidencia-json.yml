name: V5.16 Guarda - evidencias Android JSON
on:
  push:
    branches: [feature/v516-guarda-evidencia-json-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - run: npm run typecheck
      - run: npm --workspace apps/guarda run typecheck
      - name: Navegacao e JSON da hierarquia
        run: node --test tests/native-guard-navigation-v516.test.mjs tests/native-process.test.mjs tests/native-artifact.test.mjs
