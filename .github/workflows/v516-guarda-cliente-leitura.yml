name: V5.16 Guarda leitura mobile isolada
on:
  push:
    branches: [feature/v516-guarda-cliente-leitura-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm run setup
      - run: npm run typecheck
      - run: node --test tests/guard-read-mobile-v516.test.mjs tests/guard-service-mobile-v516.test.mjs tests/guard-traffic-read-http-v516.test.mjs tests/guard-traffic-mutation-http-v516.test.mjs
