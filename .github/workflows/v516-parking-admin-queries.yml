name: V5.16 — ADM Turismo leitura segura do estacionamento
on:
  push:
    branches: [feature/v516-estacionamento-consultas-admin-20261011]
    paths:
      - infra/migrations/021-parking-v516-admin-queries.sql
      - tests/integration/parking-v516-postgres.test.mjs
      - docs/PARIDADE_V516_ESTACIONAMENTO_CONSULTA_FASE23.md
      - .github/workflows/v516-parking-admin-queries.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-parking-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: TypeScript
        run: npm run typecheck
      - name: Consulta ADM com PostgreSQL e permissões reais
        run: node --test tests/integration/parking-v516-postgres.test.mjs
      - name: Regressão das diárias e da saída
        run: node --test tests/parking-stay-policy-v516.test.mjs
