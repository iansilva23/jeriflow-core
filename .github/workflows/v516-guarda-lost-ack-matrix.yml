name: V5.16 Guarda - perda de resposta e reenvio seguro
on:
  push:
    branches: [feature/v516-guarda-falha-resposta-retry-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failure-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: Typecheck e teste do cenário perda de ACK
        run: npm run typecheck && npm --workspace apps/guarda run typecheck && node --test tests/guard-lost-ack-matrix-v516.test.mjs
      - name: Regressão completa existente
        run: npm test
