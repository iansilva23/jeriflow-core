name: V5.16 Guarda - contrato SQL de apoio isolado
on:
  push:
    branches: [feature/v516-guarda-apoio-sql-isolado-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: Verificar contrato, tipagem e regressao
        run: node --test tests/guard-support-service-contract-v516.test.mjs && npm run typecheck && npm --workspace apps/guarda run typecheck && npm test
