name: V5.16 — identidade da denúncia Cidadão
on:
  push:
    branches: [feature/v516-transito-identidade-confiavel-20261010]
    paths:
      - apps/api/src/traffic-citizen-identity-v516.ts
      - tests/traffic-citizen-identity-v516.test.mjs
      - docs/PARIDADE_V516_TRANSITO_IDENTIDADE_FASE7.md
      - .github/workflows/v516-traffic-citizen-identity.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v516-traffic-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências pelo lockfile
        run: npm run setup
      - name: Paridade de identidade Cidadão/visitante
        run: node --test tests/traffic-citizen-identity-v516.test.mjs
      - name: Contrato Cidadão Guarda SEMUS
        run: node --test tests/citizen-traffic-v516.test.mjs
      - name: Validação foto
        run: node --test tests/traffic-photo-candidate-v516.test.mjs
      - name: Quarentena
        run: node --test tests/traffic-photo-quarantine-v516.test.mjs
      - name: Normalização
        run: node --test tests/traffic-photo-normalize-v516.test.mjs
      - name: Armazenamento privado
        run: node --test tests/traffic-photo-clean-store-v516.test.mjs
      - name: ClamAV simulado
        run: node --test tests/traffic-photo-malware-v516.test.mjs
      - name: TypeScript
        run: npm run typecheck
