name: V5.16 — migrações integradas Cidadão e Estacionamento
on:
  push:
    branches: [feature/v516-esquema-integrado-ci-20261011]
    paths:
      - tests/integration/v516-stacked-schema-compat.test.mjs
      - docs/PARIDADE_V516_ESQUEMA_INTEGRADO_FASE26.md
      - .github/workflows/v516-stacked-schema-compat.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-schemas:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: TypeScript
        run: npm run typecheck
      - name: PostgreSQL 17 — migrações 001 a 010 e 020 a 022 em conjunto
        run: node --test tests/integration/v516-stacked-schema-compat.test.mjs
      - name: Regressões de regras de Cidadão e estacionamento
        run: node --test tests/citizen-traffic-v516.test.mjs tests/parking-stay-policy-v516.test.mjs
