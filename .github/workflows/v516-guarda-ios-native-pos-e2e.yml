name: V5.16 4 apps iOS - nativo apos Guarda Android E2E
on:
  push:
    branches: [feature/v516-guarda-ios-native-pos-e2e-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: Tipagem geral e Guarda com fluxo V5.16
        run: npm run typecheck && npm --workspace apps/guarda run typecheck
      - name: Regressao de autorizacao, tela e navegacao nativa
        run: node --test tests/guard-access-gate-v516.test.mjs tests/guard-authorized-view-v516.test.mjs tests/guard-finish-screen-v516.test.mjs tests/guard-screen-actions-v516.test.mjs tests/native-guard-auth-navigation-v516.test.mjs
  ios-guard:
    needs: contracts
    runs-on: macos-26
    timeout-minutes: 55
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_GUARDA_V516_PREVIEW: "1"
      # Deliberadamente sem EXPO_PUBLIC_LOCAL_API, API_URL e JF_NATIVE_GUARDA_AUTH_UI_SMOKE:
      # nenhum servidor HTTP ficticio, manifest Android ou credencial.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: iOS 4 apps - compilar Release para simulador e abrir duas vezes cada
        run: node scripts/native-runner.mjs ios all full
      - name: Evidencias nativas iOS sem credenciais
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v516-guarda-ios-after-e2e-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/native/ios/all/report.json
            artifacts/native/ios/all/*.png
            artifacts/native/ios/all/*.ui.json
          if-no-files-found: warn
          retention-days: 3
