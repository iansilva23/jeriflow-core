name: V5.16 — Guarda sinalização de cidadão e análise SEMUS sem sanção
on:
  push:
    branches: [feature/v516-guarda-sinalizacao-cidadao-20261011]
    paths:
      - infra/migrations/027-citizen-v516-guard-flags.sql
      - tests/integration/traffic-guard-service-v516.test.mjs
      - docs/PARIDADE_V516_GUARDA_SINALIZACAO_FASE32.md
      - .github/workflows/v516-guard-flags.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências fixadas
        run: npm run setup
      - name: TypeScript
        run: npm run typecheck
      - name: PostgreSQL 17 — Guarda flag, plantão, apoio, protocolo e revisão ADM
        run: node --test tests/integration/traffic-guard-service-v516.test.mjs
      - name: Regressões V5.16 Cidadão e identidade
        run: node --test tests/citizen-traffic-v516.test.mjs tests/traffic-citizen-identity-v516.test.mjs
