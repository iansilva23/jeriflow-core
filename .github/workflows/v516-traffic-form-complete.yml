name: V5.16 — formulário completo e protocolo único
on:
  push:
    branches: [feature/v516-transito-envio-completo-20261010]
    paths:
      - apps/api/src/traffic-form-submit-v516.ts
      - infra/migrations/008-citizen-v516-traffic-confirm-ack.sql
      - tests/traffic-form-submit-v516.test.mjs
      - tests/integration/traffic-photo-private-pipeline-real-v516.test.mjs
      - docs/PARIDADE_V516_TRANSITO_FORMULARIO_FASE18.md
      - .github/workflows/v516-traffic-form-complete.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: TypeScript
        run: npm run typecheck
      - name: Validação do formulário canônico, sem serviço de dados
        run: node --test tests/traffic-form-submit-v516.test.mjs
      - name: Regressão da paridade original e identidade
        run: node --test tests/citizen-traffic-v516.test.mjs tests/traffic-citizen-identity-v516.test.mjs
  postgres-clamd:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: jeriflow_owner
          POSTGRES_DB: jeriflow_dev
          POSTGRES_PASSWORD: ephemeral-owner-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeriflow_owner -d jeriflow_dev"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      JF_V516_TEST_OWNER_DSN: postgresql://jeriflow_owner:ephemeral-owner-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_APP_DSN: postgresql://jeriflow_app:ephemeral-jeriflow-test-only@127.0.0.1:5432/jeriflow_dev
      JF_V516_TEST_WORKER_DSN: postgresql://jeriflow_scan_test:ephemeral-scan-test-only@127.0.0.1:5432/jeriflow_dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: Instalar clamd real com assinatura local inofensiva
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clamav-daemon
          test -x /usr/sbin/clamd
      - name: TypeScript
        run: npm run typecheck
      - name: PostgreSQL real + scanner + campos completos + confirmação segura
        run: node --test tests/integration/traffic-photo-private-pipeline-real-v516.test.mjs
