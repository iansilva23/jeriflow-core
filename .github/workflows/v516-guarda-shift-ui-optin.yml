name: V5.16 Guarda - plantao RN preview
on:
  push:
    branches: [feature/v516-guarda-shift-ui-optin-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - name: Tipagem e contrato do plantao na UI
        run: npm run typecheck && npm --workspace apps/guarda run typecheck && node --test tests/guard-shift-ui-optin-v516.test.mjs
      - name: Regressao integral
        run: npm test
