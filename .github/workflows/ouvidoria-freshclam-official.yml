name: Ouvidoria - atualizacao oficial FreshClam
on:
  push:
    branches: [feature/ouvidoria-clamav-oficial-e2e-20261009]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Instalar FreshClam e sigtool
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -q -y --no-install-recommends clamav clamav-freshclam clamav-daemon
          freshclam --version
          sigtool --version
      - name: Baixar main daily bytecode e escanear com clamd REAL
        timeout-minutes: 17
        run: node scripts/homologation/freshclam-official.mjs
      - name: Arquivar diagnostico sem assinaturas ou dados reais
        if: ${{ always() && hashFiles('artifacts/clamav-official/report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freshclam-official-${{ github.run_id }}
          path: artifacts/clamav-official/report.json
          retention-days: 14
