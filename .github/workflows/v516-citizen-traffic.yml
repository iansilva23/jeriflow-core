name: V5.16 — contrato Cidadão, Guarda e SEMUS
on:
  push:
    branches: [feature/v516-cidadao-transito-contrato-20261010]
    paths:
      - packages/contracts/src/citizen-traffic-v516.ts
      - tests/citizen-traffic-v516.test.mjs
      - .github/workflows/v516-citizen-traffic.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v516-traffic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node fixado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Instalar dependências pelo lockfile
        run: npm run setup
      - name: Contrato e estados da V5.16
        run: node --test tests/citizen-traffic-v516.test.mjs
      - name: Verificação TypeScript dos módulos
        run: npm run typecheck
