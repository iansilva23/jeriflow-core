name: V5.16 — pipeline privado de fotografia Trânsito
on:
  push:
    branches: [feature/v516-pipeline-privado-foto-20261010]
    paths:
      - apps/api/src/traffic-photo-private-pipeline-v516.ts
      - apps/api/src/traffic-photo-http-v516.ts
      - tests/traffic-photo-private-pipeline-v516.test.mjs
      - docs/PARIDADE_V516_PIPELINE_FOTO_FASE17.md
      - .github/workflows/v516-traffic-private-pipeline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependências
        run: npm run setup
      - name: TypeScript
        run: npm run typecheck
      - name: Pipeline real de arquivos Sharp e HTTP isolado
        run: node --test tests/traffic-photo-private-pipeline-v516.test.mjs
      - name: Regressão HTTP e contrato V5.16
        run: node --test tests/traffic-photo-http-v516.test.mjs tests/citizen-traffic-v516.test.mjs
      - name: Regressão do worker e do scanner sem ClamAV oficial
        run: node --test tests/traffic-photo-malware-v516.test.mjs tests/traffic-photo-official-worker-v516.test.mjs
