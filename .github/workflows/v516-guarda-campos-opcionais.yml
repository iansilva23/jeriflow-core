name: V5.16 Guarda campos opcionais
on:
  push:
    branches: [feature/v516-guarda-campos-opcionais-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm run setup
      - run: npm run typecheck
      - run: npm --workspace apps/guarda run typecheck
      - run: node --test tests/guard-optional-fields-v516.test.mjs tests/guard-screen-actions-v516.test.mjs
